<!DOCTYPE html>
<html lang="zh-CN" data-theme="amber">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F2DCBB">
    <title>看得见的声音 · 普通话发音学习</title>
    <script>
      // 首屏应用主题，避免先按默认色画一帧再切换（值由 src/utils/theme.ts 写入）
      try {
        var t = localStorage.getItem('vs_theme')
        document.documentElement.dataset.theme = t === 'celadon' ? 'celadon' : 'amber'
        if (t === 'celadon') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#E9F2E6')
        }
      } catch (e) {
        document.documentElement.dataset.theme = 'amber'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
